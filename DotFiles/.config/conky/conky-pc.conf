-- Conky, a system monitor https://github.com/brndnmtthws/conky

-- https://conky.cc/config_settings
conky.config = {
    alignment = 'top_right',
    background = true,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = true,
    default_shade_color = '#000000',
    extra_newline = false,
    font = 'Roboto:bold:size=14',
    gap_x = 40,
    gap_y = 60,
    minimum_height = 5,
    minimum_width = 250,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_wayland = true,
    out_to_x = true,

    own_window = true,
    own_window_type = 'dock',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 235,  -- 0 = fully transparent, 255 = solid
    own_window_colour = '#1a1a1a', -- dark gray background

    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
}
-- https://conky.cc/variables
conky.text = [[
${color red}Distro:$color SteavenLinux
${color red}Kernel:$color $kernel
${color red}CPU:$color Ryzen 5 5500
${color red}GPU:$color RX 7600 XT
$hr
${color red}Uptime:$color $uptime
$hr
${color red}CPU Usage:$color $cpu% ${cpubar 6}
${color red}CPU Freq:$color $freq MHz / $freq_g GHz
${color red}CPU Temp:$color ${execi 5 sensors | grep 'Tdie:' | awk '{print $2}'}
${color red}CPU Watts:$color ${execi 5 ~/.config/conky/cpu-watts.sh}
${color red}Fans:$color ${execi 5 ~/.config/conky/fans.sh}
${color red}RAM Usage:$color $mem / $memmax ($memperc%) ${membar 6}
${color red}Swap Usage:$color $swap / $swapmax ($swapperc%) ${swapbar 6}
${color red}Processes:$color $processes
$hr
${color red}GPU Usage:$color ${execi 5 ~/.config/conky/amdgpu-usage.sh -usage}
${color red}GPU Temp:$color ${execi 5 ~/.config/conky/amdgpu-usage.sh -temp}
${color red}GPU Watts:$color ${execi 5 ~/.config/conky/amdgpu-usage.sh -power}
${color red}Vram Usage:$color ${execi 5 ~/.config/conky/amdgpu-vram-usage.sh} / 16GiB
$hr
${color red}File systems:
 /        $color${fs_used /} / ${fs_size /} ${fs_bar 6 /}
 ${color red}/home    $color${fs_used /home} / ${fs_size /home} ${fs_bar 6 /home}
 ${color red}/mnt/hdd $color${fs_used /mnt/hdd} / ${fs_size /mnt/hdd} ${fs_bar 6 /mnt/hdd}
 ${color red}/mnt/hdd2$color${fs_used /mnt/hdd2} / ${fs_size /mnt/hdd2} ${fs_bar 6 /mnt/hdd2}
 ${color red}/mnt/hdd3$color${fs_used /mnt/hdd3} / ${fs_size /mnt/hdd3} ${fs_bar 6 /mnt/hdd3}
 ${color red}/mnt/hdd4$color${fs_used /mnt/hdd4} / ${fs_size /mnt/hdd4} ${fs_bar 6 /mnt/hdd4}
$hr
${color red}Networking:
Up: ${color}${upspeed br0}   ${color red}Down: ${color}${downspeed br0}
$hr
${color red}Processes:
${color red}Name              PID     CPU%   MEM%
${color lightgrey}${top name 1} ${top pid 1}   ${top cpu 1}   ${top mem 1}
${color lightgrey}${top name 2} ${top pid 2}   ${top cpu 2}   ${top mem 2}
${color lightgrey}${top name 3} ${top pid 3}   ${top cpu 3}   ${top mem 3}
${color lightgrey}${top name 4} ${top pid 4}   ${top cpu 4}   ${top mem 4}
]]
