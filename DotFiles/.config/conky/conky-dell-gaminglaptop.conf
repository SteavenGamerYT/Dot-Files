-- Conky, a system monitor https://github.com/brndnmtthws/conky

-- https://conky.cc/config_settings
conky.config = {
    alignment = 'top_right',
    background = true,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = true,
    default_shade_color = '#000000',
    extra_newline = false,
    font = 'Roboto:bold:size=12',
    gap_x = 40,
    gap_y = 60,
    minimum_height = 5,
    minimum_width = 250,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_wayland = true,
    out_to_x = true,

    own_window = false,
    own_window_type = 'dock',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 235,  -- 0 = fully transparent, 255 = solid
    own_window_colour = '#1a1a1a', -- dark gray background

    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
}
-- https://conky.cc/variables
conky.text = [[
${color red}Distro:$color SteavenLinux
${color red}Kernel:$color $kernel
${color red}CPU:$color Intel i7-10870H
${color red}GPU1:$color Intel UHD
${color red}GPU2:$color RTX 3060 Mobile
$hr
${color red}Uptime:$color $uptime
$hr
${color red}CPU Usage:$color $cpu% ${cpubar 6}
${color red}CPU Freq:$color $freq MHz / $freq_g GHz
${color red}CPU Temp:$color ${execi 5 sensors | awk '/Core [0-9]:/ {gsub("\\+","",$3); gsub("°C","",$3); if ($3>max) max=$3} END {printf "%.1f°C", max}'}
${color red}CPU Watts:$color ${execi 5 bash -c 'E1=$(cat /sys/class/powercap/intel-rapl:0/energy_uj); sleep 1; E2=$(cat /sys/class/powercap/intel-rapl:0/energy_uj); W=$(echo "scale=3; ($E2-$E1)/1000000" | bc); echo "${W}W"'}
${color red}CPU Fan:$color ${execi 5 bash -c "sensors alienware_wmi-virtual-0 | awk -F'[: ]+' '/CPU Fan/ {print \$3 \" RPM\"}'"}
${color red}GPU Fan:$color ${execi 5 bash -c "sensors alienware_wmi-virtual-0 | awk -F'[: ]+' '/GPU Fan/ {print \$3 \" RPM\"}'"}
${color red}RAM Usage:$color $mem / $memmax ($memperc%) ${membar 6}
${color red}Swap Usage:$color $swap / $swapmax ($swapperc%) ${swapbar 6}
${color red}Processes:$color $processes
$hr
${color red}GPU2 Usage:$color ${execi 5 ~/.config/conky/nvidia-usage.sh -usage}
${color red}GPU2 Temp:$color ${execi 5 ~/.config/conky/nvidia-usage.sh -temp}
${color red}GPU2 Watts:$color ${execi 5 ~/.config/conky/nvidia-usage.sh -power}
${color red}Vram2 Usage:$color ${execi 5 ~/.config/conky/nvidia-vram-usage.sh} / 4GiB
$hr
${color red}File systems:
 /        $color${fs_used /} / ${fs_size /} ${fs_bar 6 /}
 ${color red}/home    $color${fs_used /home} / ${fs_size /home} ${fs_bar 6 /home}
 ${color red}/mnt/nvme $color${fs_used /mnt/nvme} / ${fs_size /mnt/nvme} ${fs_bar 6 /mnt/nvme}
$hr
${color red}Networking:
Up: ${color}${upspeed br0}   ${color red}Down: ${color}${downspeed br0}
$hr
${color red}Processes:
${color red}Name              PID     CPU%   MEM%
${color lightgrey}${top name 1} ${top pid 1}   ${top cpu 1}   ${top mem 1}
${color lightgrey}${top name 2} ${top pid 2}   ${top cpu 2}   ${top mem 2}
${color lightgrey}${top name 3} ${top pid 3}   ${top cpu 3}   ${top mem 3}
${color lightgrey}${top name 4} ${top pid 4}   ${top cpu 4}   ${top mem 4}
]]
