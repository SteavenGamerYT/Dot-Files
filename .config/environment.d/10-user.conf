# ~/.config/environment.d/10-user.conf

# General environment variables
MOZ_ENABLE_WAYLAND=1
XDG_SCREENSHOTS_DIR=${HOME}/Pictures/Screenshots
EDITOR=nano
ELECTRON_OZONE_PLATFORM_HINT=auto

# QT and Cursor theming (applied globally)
QT_STYLE_OVERRIDE=kvantum
KVANTUM_THEME=Nordic-solid
QT_QPA_PLATFORMTHEME=qt6ct
ICON_THEME=Papirus-Dark
QT_QPA_ICONTHEME=Papirus-Dark
CURSOR_THEME=Nordzy-cursors
QT_QT_CURSORTHEME=Nordzy-cursors
QT_QT5_CURSORTHEME=Nordzy-cursors
QT_QT6_CURSORTHEME=Nordzy-cursors
CURSOR_SIZE=24
XCURSOR_SIZE=24
XCURSOR_THEME=Nordzy-cursors
GTK_THEME=Nordic
KDE_COLOR_SCHEME="Nordic"
