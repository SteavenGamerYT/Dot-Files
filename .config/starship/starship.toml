format = """
[░▒▓](#4c566a)\
[ 󰤇 ](bg:#4c566a fg:#eceff4)\
[](bg:#88c0d0 fg:#4c566a)\
$directory\
[](fg:#88c0d0 bg:#3b4252)\
$git_branch\
$git_status\
[](fg:#3b4252 bg:#2e3440)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#2e3440 bg:#242933)\
$time\
[ ](fg:#242933)\
\n$character"""
command_timeout = 2000

[directory]
style = "fg:#2e3440 bg:#88c0d0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#3b4252"
format = '[[ $symbol $branch ](fg:#eceff4 bg:#3b4252)]($style)'

[git_status]
style = "bg:#3b4252"
format = '[[($all_status$ahead_behind )](fg:#88c0d0 bg:#3b4252)]($style)'

[nodejs]
symbol = ""
style = "bg:#2e3440"
format = '[[ $symbol ($version) ](fg:#a3be8c bg:#2e3440)]($style)'

[rust]
symbol = ""
style = "bg:#2e3440"
format = '[[ $symbol ($version) ](fg:#d08770 bg:#2e3440)]($style)'

[golang]
symbol = ""
style = "bg:#2e3440"
format = '[[ $symbol ($version) ](fg:#81a1c1 bg:#2e3440)]($style)'

[php]
symbol = ""
style = "bg:#2e3440"
format = '[[ $symbol ($version) ](fg:#b48ead bg:#2e3440)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#242933"
format = '[[  $time ](fg:#eceff4 bg:#242933)]($style)'

[character]
success_symbol = "[❯](bold #88c0d0)"
error_symbol = "[❯](bold #bf616a)"
